- name: Check if /etc/sudoers exists
  ansible.builtin.stat:
    path: /etc/sudoers
  register: sudoers_stat

- name: Create basic sudoers file if missing
  ansible.builtin.copy:
    content: |
      root ALL=(ALL:ALL) ALL
      %sudo ALL=(ALL:ALL) ALL
    dest: /etc/sudoers
    mode: '0440'
    backup: true
  become: true
  when: not sudoers_stat.stat.exists

- name: Ensure user has sudo privileges without password
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^#?{{ ssh_user }}'
    line: '{{ ssh_user }} ALL=(ALL) NOPASSWD:ALL'
    validate: 'visudo -cf %s'
  become: true


- name: Add Proxmox CLI tools to PATH for user {{ ssh_user }}
  ansible.builtin.lineinfile:
    path: '/home/{{ ssh_user }}/.bashrc'
    line: 'export PATH=$PATH:/usr/sbin:/sbin'
    create: true
    mode: '0644'
  become: true

- name: Set permissions on .bashrc for user {{ ssh_user }}
  ansible.builtin.file:
    path: '/home/{{ ssh_user }}/.bashrc'
    mode: '0644'
    owner: '{{ ssh_user }}'
    group: '{{ ssh_user }}'
  become: true

- name: Add Proxmox CLI tools to PATH system-wide
  ansible.builtin.lineinfile:
    path: /etc/profile
    line: 'export PATH=$PATH:/usr/sbin:/sbin'
    create: true
    mode: '0644'
  become: true

- name: Set permissions on /etc/profile
  ansible.builtin.file:
    path: /etc/profile
    mode: '0644'
  become: true
