---
- name: Ensure snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: '0755'
  become: true

- name: Ensure PubkeyAuthentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
  notify: Restart ssh

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: ~/.ssh
    state: directory
    mode: '0700'

- name: Add local public SSH key to authorized keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    state: present
    key: "{{ lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') | default('') }}"

- name: Hash password
  ansible.builtin.set_fact:
    hashed_password: "{{ ssh_user_password | password_hash('sha512') }}"

- name: Create user {{ ssh_user }}
  ansible.builtin.user:
    name: '{{ ssh_user }}'
    password: '{{ hashed_password }}'
    groups: sudo,adm # Add to groups for similar permission scope as root
    state: present
  become: true

- name: Ensure ~/.ssh directory exists for user {{ ssh_user }}
  ansible.builtin.file:
    path: '/home/{{ ssh_user }}/.ssh'
    state: directory
    mode: '0700'
    owner: '{{ ssh_user }}'
    group: '{{ ssh_user }}'
  become: true

- name: Add local public SSH key to authorized keys for user {{ ssh_user }}
  ansible.posix.authorized_key:
    user: '{{ ssh_user }}'
    state: present
    key: "{{ lookup('file', '~/.ssh/id_rsa.pub', errors='ignore') | default('') }}"
  become: true

